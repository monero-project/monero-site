books:
  - title: Zero to Monero
    subtitle: Second Edition
    description: A comprehensive conceptual and technical explanation of Monero. Learn how Monero works at a deep level and discover how beautiful cryptography can be.
    cover: images/z2m-2nd.avif
    coverAlt: Zero to Monero Second Edition cover
    link: /library/Zero-to-Monero-2-0-0.pdf
    translations:
      - locale: ru
        url: /library/Zero-to-Monero-2-0-0-ru.pdf
      - locale: pt
        url: /library/Zero-to-Monero-2-0-0-pt.pdf
      - locale: it
        url: /library/Zero-to-Monero-2-0-0-it.pdf
  - title: Zero to Monero
    subtitle: First Edition
    description: "The original technical explanation of Monero, providing foundational knowledge of the protocol and its cryptographic principles."
    cover: images/z2m-1st.avif
    coverAlt: Zero to Monero First Edition cover
    link: /library/Zero-to-Monero-1-0-0.pdf
  - title: Mastering Monero
    subtitle: Your guide to Monero
    description: "A guide through the world of Monero, covering everything from blockchain basics to advanced technical concepts like Bulletproofs and multisig."
    cover: images/masteringmonero.avif
    coverAlt: Mastering Monero cover
    link: "https://masteringmonero.com/free-download.html"
