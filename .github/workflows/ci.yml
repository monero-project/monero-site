name: CI

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  release:
    types: [published]

permissions:
  contents: read

env:
  HUGO_VERSION: "0.167.0"
  PRE_COMMIT_VERSION: "4.6.2"

jobs:
  lint:
    name: Lint & Format
    if: github.event_name != 'release' || github.event.release.target_commitish == 'beta'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Check unescaped HTML
        # safeHTML & co. switch off escaping. They are allowed only for tag
        # wrappers (printf "<%s...") and in the reviewed helpers/render hooks
        # below; translation strings go through helpers/markdown, which sanitizes.
        run: |
          if grep -rnE 'safe(HTML|HTMLAttr|JS|CSS|URL)\b' layouts \
            | grep -vE '^layouts/(_partials/helpers/(attrs|markdown|moneropedia-content)\.html|_markup/render-(link|image)\.html|all\.enredirect\.html):' \
            | grep -vE 'printf "</?%s(%s)?>"' \
            | grep -vE 'htmlEscape'; then
            echo "Error: unescaped output outside the reviewed places (see above)"
            exit 1
          fi
          echo "All unescaped output is in reviewed places"

      # the pre-commit hooks (.pre-commit-config.yaml) on every file: CSS lint and
      # formatting (Biome), component styles scoped, YAML (yamllint) and JSON
      # formatting, final newlines, trailing spaces, valid JSON/YAML. pre-commit
      # installs Biome and yamllint from the revs in its config.
      - name: Cache pre-commit's hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the pre-commit hooks
        run: |
          pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure

  reproducible-archive:
    # Build the site twice and check both archives are byte-identical. On a
    # release, the first run's archive is attached to the release.
    name: Reproducible Archive (Run ${{ matrix.run }})
    if: github.event_name != 'release' || github.event.release.target_commitish == 'beta'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        run: [1, 2]
    outputs:
      hash-1: ${{ steps.hash.outputs.hash-1 }}
      hash-2: ${{ steps.hash.outputs.hash-2 }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # to see what a push or pull request changes

      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSLO "$base/$tarball"
          curl -sSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $tarball\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c
          tar -xzf "$tarball" hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      # Pushes and PRs build a reduced site, as fast as possible: the newest 10
      # posts and English, plus the posts and languages the change touches (see
      # scripts/ci-build-scope.sh). A release builds the whole site for its archive.
      - name: Choose what to build
        if: github.event_name != 'release'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }} # PR target branch
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }} # commit before the push
        run: |
          base=""
          if [ -n "$BASE_BRANCH" ]; then base=$(git merge-base "origin/$BASE_BRANCH" HEAD)
          elif [ -n "$BEFORE" ]; then base=$BEFORE
          fi
          scripts/ci-build-scope.sh "$base" | tee -a "$GITHUB_ENV"

      - name: Build site
        run: hugo --gc

      - name: Check the site has no JavaScript
        run: python3 scripts/check-no-js.py dist

      - name: Create archive
        run: |
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u=rwX,go=rX' \
            -czf dist.tar.gz dist/

      - name: Hash archive
        id: hash
        run: |
          HASH=$(sha256sum dist.tar.gz | awk '{print $1}')
          echo "hash-${{ matrix.run }}=$HASH" >> $GITHUB_OUTPUT

      - name: Upload archive
        if: github.event_name == 'release' && matrix.run == 1
        uses: actions/upload-artifact@v7
        with:
          name: deploy-dist-archive
          path: dist.tar.gz

  compare-archives:
    name: Compare hashes
    if: github.event_name != 'release' || github.event.release.target_commitish == 'beta'
    runs-on: ubuntu-22.04
    needs: reproducible-archive

    permissions:
      contents: write

    steps:
      - name: Compare
        run: |
          HASH1="${{ needs.reproducible-archive.outputs.hash-1 }}"
          HASH2="${{ needs.reproducible-archive.outputs.hash-2 }}"
          if [ "$HASH1" = "$HASH2" ]; then
            echo "hashes match."
          else
            echo "hash mismatch."
            exit 1
          fi

      - name: Download release archive
        if: github.event_name == 'release'
        uses: actions/download-artifact@v8
        with:
          name: deploy-dist-archive

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist.tar.gz
